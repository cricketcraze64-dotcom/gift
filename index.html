<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birthday Memories</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

h1{font-size:clamp(40px,8vw,60px);font-weight:400;letter-spacing:-.045em;line-height:1.04;margin:0 0 10px;text-wrap:balance}
.sub{color:#e9d8b8;opacity:.9;margin-bottom:24px;font-size:15px}

input[type=text]{width:100%;min-width:0;padding:13px 15px;margin:4px 0;border:1px solid rgba(255,255,255,.16);background:rgba(12,12,12,.46);color:#fff;border-radius:12px;font:16px Arial,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}

label.b{background:var(--card);color:var(--ink);border:1px solid var(--line)}

#musicBtn{display:inline-flex;align-items:center;gap:7px}

#musicBtn.playing{border-color:#e5c27e;color:#ffe7b0}

  h1{font-size:clamp(38px,11vw,52px)}

  .box{margin:auto;padding:22px 24px}

</style>
</head>

function drawPhotoCaption(g,text){
  var words=String(text).trim().split(/\s+/),lines=[],fontSize=28,line='';
  function wrap(){
    lines=[];line='';
    words.forEach(function(word){
      var pieces=[],piece='';
      for(var i=0;i<word.length;i++){
        var candidate=piece+word[i];
        if(piece&&g.measureText(candidate).width>920){pieces.push(piece);piece=word[i]}
        else piece=candidate;
      }
      if(piece)pieces.push(piece);
      pieces.forEach(function(part){
        var candidateLine=line?line+' '+part:part;
        if(g.measureText(candidateLine).width<=920){line=candidateLine;return}
        if(line)lines.push(line);
        line=part;
      });
    });
    if(line)lines.push(line);
  }
  while(true){
    g.font='bold '+fontSize+'px Georgia';wrap();
    if(lines.length<=2||fontSize<=16)break;
    fontSize-=2;
  }
  g.fillStyle='#f6eddc';g.fillRect(0,438,1024,138);
  g.fillStyle='#bd8d49';g.fillRect(48,454,4,98);
  g.fillStyle='#927145';g.textAlign='left';g.textBaseline='alphabetic';
  g.font='bold 15px Arial';g.letterSpacing='3px';g.fillText('A BIRTHDAY MEMORY',70,470);g.letterSpacing='0px';
  g.fillStyle='#392d32';g.font='bold '+fontSize+'px Georgia';g.textBaseline='middle';
  var lineHeight=fontSize+5,startY=522-(lines.length-1)*lineHeight/2;
  lines.forEach(function(captionLine,index){g.fillText(captionLine,70,startY+index*lineHeight,920)});
  g.textBaseline='alphabetic';
}

  girl.bub.visible=false;boy.x=0;boy.z=9.4;boy.rot=PI;boy.g.visible=false;boy.sit=false;boy.bub.visible=false;boy.mode='hidden';boy.q=[];
  waiter.g.visible=false;waiter.walking=false;waiterTray.visible=true;waiterService='idle';canDeliveries=[];
  door.visible=true;
  door.rotation.y=0;
  roomMaterials[4].visible=true;
  servingCans.forEach(function(can,i){
    if(can.parent!==waiterTray)waiterTray.add(can);
    can.position.set(i===0?-.2:.2,1.7,.43);can.rotation.set(0,0,0);
  });
  if(knife.parent!==cakeSet)cakeSet.add(knife);
  knife.position.set(3.95,1.5,-1.15);knife.rotation.set(0,0,0);knife.visible=true;
  girl.dancing=false;boy.dancing=false;girl.dance=false;boy.dance=false;girl.hugging=false;boy.hugging=false;
  girl.coupleDancing=false;boy.coupleDancing=false;
  girl.holdingHands=false;boy.holdingHands=false;girl.holdingKnife=false;girl.knifeMotion=0;boy.holdingKnife=false;boy.knifeMotion=0;
  [girl,boy].forEach(function(actor){actor.drinking=false;actor.drinkProgress=0;actor.drinkCan=null;actor.waving=false;actor.feeding=false;actor.feedProgress=0;actor.eating=false});
  if(cakeBite.parent!==cakeSet)cakeSet.add(cakeBite);
  cakeBite.position.set(4.15,1.5,-1.15);cakeBite.rotation.set(0,0,0);cakeBite.visible=false;
  photoStartedAt=0;drinkPhase=0;drinkUntil=0;
  dietCans.visible=false;
  danceFloor.visible=false;cakeSet.visible=false;cakeGroup.rotation.set(0,0,0);knife.visible=true;
  danceLights.forEach(function(light){light.intensity=0});cakeFireworkLights.forEach(function(light){light.intensity=0});
  cakeFireworks.forEach(function(p){S.remove(p);p.geometry.dispose();p.material.dispose()});cakeFireworks=[];cakeBurstAt=0;
  endingStage='idle';endingAt=0;endingDone=false;
  dz.ph=0;dz.t0=0;
  setNightMode(false);
  frames.forEach(function(frame){frame.mesh.visible=true});
  tv.visible=false;buildSteps();gi=0;state='run';tvOn=false;slide=0;shown=false;
  camMode='auto';Cam.position.set(0,2.4,4);look.set(0,1.4,8);
}

// ---------- camera + controls ----------
var camMode='auto',look=new THREE.Vector3(0,1.4,8),yaw=0,pitch=0,drag=false,lx=0,ly=0,held={};
function setFree(){if(camMode==='auto'){camMode='free';yaw=Cam.rotation.y;pitch=Cam.rotation.x}}
cnv.addEventListener('pointerdown',function(e){setFree();drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',function(){drag=false});
addEventListener('pointermove',function(e){if(!drag)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-.8,Math.min(.8,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
addEventListener('keydown',function(e){if(e.key.indexOf('Arrow')==0||'wasd'.indexOf(e.key)>-1)setFree();held[e.key]=1});
addEventListener('keyup',function(e){held[e.key]=0});
['fw','bk'].forEach(function(id){var b=$(id);b.onpointerdown=function(e){e.preventDefault();setFree();held[id]=1};b.onpointerup=b.onpointerleave=function(){held[id]=0}});

function loop(t){
  requestAnimationFrame(loop);
  if(state==='run'||(state==='seated'&&endingStage==='idle')){stepGirl();stepBoy()}
  else if(state==='dance')stepDance();
  updateWaiterService();
  updateEnding(NOW());
  updateDrinks(NOW());
  anim(girl,t);anim(boy,t);
  anim(waiter,t);
  if(tvOn&&NOW()-lastSl>3000){
    if(slide<CONFIG.slides.length-1){slide=slide<0?0:slide+1;drawTV(slide);lastSl=NOW()}
    else{tvOn=false;tv.visible=false;startDance()}
  }
  if(camMode==='auto'){
    var p,l;
    if(outsideActive){
      p=innerWidth<600?new THREE.Vector3(0,4.15,19):new THREE.Vector3(0,4.6,18);
      l=new THREE.Vector3(0,1.35,11.7);
    }else if(state==='dance'){
      p=new THREE.Vector3(0,4.2,7);l=new THREE.Vector3(0,1.3,1.3);
    }else if(endingStage==='dance'||endingStage==='danceTravel'){
      p=new THREE.Vector3(0,4.2,7);l=new THREE.Vector3(0,1.2,1.1);
    }else if(endingStage==='toCake'||endingStage==='pickKnife'||endingStage==='cutCake'||endingStage==='cakeFireworks'||endingStage==='feedTravel'||endingStage==='feedCake'){
      p=new THREE.Vector3(7,3.5,3.5);l=new THREE.Vector3(2.6,1.2,-.55);
    }else if(endingStage==='exit'||endingStage==='gateOpening'||endingStage==='gateClosing'||endingStage==='farewellWalk'||endingStage==='farewellTogether'){
      p=new THREE.Vector3(0,4.2,4.2);l=new THREE.Vector3(0,1.4,9.6);
    }else if(state==='seated'){p=new THREE.Vector3(0,3.8,2.8);l=new THREE.Vector3(0,1.5,-7.2)}
    else{
      var focus=girl.g.visible&&girl.mode==='followBoy'?null:(girl.g.visible?girl:boy);
      var focusX=focus?focus.x:(girl.x+boy.x)/2,focusZ=focus?focus.z:(girl.z+boy.z)/2;
      var focusRot=focus?focus.rot:boy.rot;
      var fx=Math.sin(focusRot),fz=Math.cos(focusRot);
      p=new THREE.Vector3(cl(focusX-fx*4.2),2.6,cl(focusZ-fz*4.2));
      if(Math.hypot(p.x-focusX,p.z-focusZ)<2.5)p.set(cl(focusX+fx*4),2.6,cl(focusZ+fz*4));
      l=new THREE.Vector3(focusX,1.3,focusZ);
    }
    Cam.position.lerp(p,.04);look.lerp(l,.08);
    var targetFov=state==='seated'&&tvOn&&innerWidth>=600?40:(innerWidth<600?74:65);
    if(Math.abs(Cam.fov-targetFov)>.05){Cam.fov+=(targetFov-Cam.fov)*.06;Cam.updateProjectionMatrix()}
    Cam.lookAt(look);
  }else{
    var v=(held.ArrowUp||held.w||held.fw?1:0)-(held.ArrowDown||held.s||held.bk?1:0);
    if(held.ArrowLeft||held.a)yaw+=.025;if(held.ArrowRight||held.d)yaw-=.025;
    if(v){Cam.position.x=cl(Cam.position.x-Math.sin(yaw)*.08*v);Cam.position.z=cl(Cam.position.z-Math.cos(yaw)*.08*v)}
    Cam.rotation.set(pitch,yaw,0);
  }
  R.render(S,Cam);
}
requestAnimationFrame(loop);

var MUSIC_CUE_SECONDS=.45;
var music=$('music'),musicBtn=$('musicBtn'),musicLabel=$('musicLabel');
function syncMusicButton(){
  var playing=!music.paused&&!music.ended;
  musicBtn.classList.toggle('playing',playing);
  musicBtn.setAttribute('aria-pressed',playing?'true':'false');
  musicBtn.setAttribute('aria-label',playing?'Pause music':'Play music');
  musicLabel.textContent=playing?'Sound on':'Music';
}
function showMusicError(){
  musicBtn.classList.remove('playing');
  musicBtn.setAttribute('aria-pressed','false');
  musicBtn.setAttribute('aria-label','Music unavailable; tap to retry');
  musicLabel.textContent='Retry music';
  musicBtn.title='The song could not be loaded. Check that the MP3 file is beside index.html.';
}
function requestMusicPlayback(){
  try{
    var playRequest=music.play();
    if(playRequest&&typeof playRequest.catch==='function'){
      playRequest.then(syncMusicButton).catch(showMusicError);
    }
  }catch(error){showMusicError()}
}
function startMusicAtCue(){
  if(music.error){showMusicError();return}
  music.currentTime=MUSIC_CUE_SECONDS;
  requestMusicPlayback();
}
function stopMusic(){
  music.pause();
  if(music.readyState>0)music.currentTime=MUSIC_CUE_SECONDS;
}
music.addEventListener('play',syncMusicButton);
music.addEventListener('pause',syncMusicButton);
music.addEventListener('ended',syncMusicButton);
music.addEventListener('error',showMusicError);
musicBtn.onclick=function(){
  if(music.paused){
    if(music.currentTime<MUSIC_CUE_SECONDS)music.currentTime=MUSIC_CUE_SECONDS;
    requestMusicPlayback();
  }else music.pause();
};
$('start').onclick=function(){$('intro').classList.add('hide');startShow();startMusicAtCue()};
$('replayBtn').onclick=function(){startShow();startMusicAtCue()};
$('autoBtn').onclick=function(){camMode='auto'};
</script>
